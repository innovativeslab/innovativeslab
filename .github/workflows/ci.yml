name: CI

on:
  pull_request:
  push:
    branches: [integration/innovations-labs]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI never connects to a database or sends email.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Early stage branches have no pages yet, so only build once the app exists.
      - name: Production build
        if: ${{ hashFiles('src/app/page.tsx') != '' }}
        run: npm run build
